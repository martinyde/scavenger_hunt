nelmio_api_doc:
    documentation:
        info:
            title: Scavenger Hunt Admin API
            description: Internal REST API for the Scavenger Hunt application. Used by the race-frontend and archive sites.
            version: 1.0.0
        components:
            securitySchemes:
                ApiKey:
                    type: apiKey
                    in: header
                    name: X-API-KEY
        security:
            - ApiKey: []
    areas:
        path_patterns:
            - ^/api/v1
