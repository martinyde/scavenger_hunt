version: '3'

vars:
  DOCKER_COMPOSE: '{{.TASK_DOCKER_COMPOSE | default "docker compose"}}'

tasks:
  start:
    desc: "Start all three sites"
    cmds:
      - task: admin:start
      - task: race:start
      - task: archive:start

  stop:
    desc: "Stop all three sites"
    cmds:
      - task: archive:stop
      - task: race:stop
      - task: admin:stop

  sites:open:
    desc: "Open all three sites in the default browser"
    cmds:
      - task: sites:open:admin
      - task: sites:open:race
      - task: sites:open:archive

  sites:open:admin:
    desc: "Open admin site in the default browser"
    dir: admin
    dotenv: ['.env']
    cmds:
      - open "https://admin-${COMPOSE_DOMAIN}"
    silent: true

  sites:open:race:
    desc: "Open race-frontend site in the default browser"
    dir: race-frontend
    dotenv: ['.env']
    cmds:
      - open "https://race-${COMPOSE_DOMAIN}"
    silent: true

  sites:open:archive:
    desc: "Open archive site in the default browser"
    dir: archive
    dotenv: ['.env']
    cmds:
      - open "https://archive-${COMPOSE_DOMAIN}"
    silent: true

  # ============ ADMIN ============
  admin:compose:
    dir: admin
    cmds:
      - '{{.DOCKER_COMPOSE}} {{.CLI_ARGS}}'

  admin:start:
    desc: "Start admin site (includes shared infrastructure)"
    dir: admin
    cmds:
      - '{{.DOCKER_COMPOSE}} pull'
      - '{{.DOCKER_COMPOSE}} up --detach --remove-orphans --wait'
      - '{{.DOCKER_COMPOSE}} exec phpfpm composer install'
      - '{{.DOCKER_COMPOSE}} run --rm node sh -c "npm install && npm run build"'
      - '{{.DOCKER_COMPOSE}} exec phpfpm bin/console doctrine:migrations:migrate --no-interaction'

  admin:stop:
    desc: "Stop admin site"
    dir: admin
    cmds:
      - '{{.DOCKER_COMPOSE}} down'

  admin:composer:
    desc: "Run composer in admin site"
    dir: admin
    cmds:
      - '{{.DOCKER_COMPOSE}} exec phpfpm composer {{.CLI_ARGS}}'
    silent: true

  admin:console:
    desc: "Run Symfony console in admin site"
    dir: admin
    cmds:
      - '{{.DOCKER_COMPOSE}} exec phpfpm bin/console {{.CLI_ARGS}}'
    silent: true

  admin:migrate:
    desc: "Run database migrations"
    dir: admin
    cmds:
      - '{{.DOCKER_COMPOSE}} exec phpfpm bin/console doctrine:migrations:migrate --no-interaction'
    silent: true

  admin:fixtures:
    desc: "Load admin Doctrine fixtures (DESTRUCTIVE — purges admin DB)"
    dir: admin
    cmds:
      - '{{.DOCKER_COMPOSE}} exec phpfpm bin/console doctrine:fixtures:load --no-interaction'
    silent: true

  admin:fixtures:fresh:
    desc: "Migrate then load admin fixtures (DESTRUCTIVE — purges admin DB)"
    dir: admin
    cmds:
      - '{{.DOCKER_COMPOSE}} exec phpfpm bin/console doctrine:migrations:migrate --no-interaction'
      - '{{.DOCKER_COMPOSE}} exec phpfpm bin/console doctrine:fixtures:load --no-interaction'
    silent: true

  # ============ RACE FRONTEND ============
  race:compose:
    dir: race-frontend
    cmds:
      - '{{.DOCKER_COMPOSE}} {{.CLI_ARGS}}'

  race:start:
    desc: "Start race-frontend site"
    dir: race-frontend
    cmds:
      - '{{.DOCKER_COMPOSE}} pull'
      - '{{.DOCKER_COMPOSE}} up --detach --remove-orphans --wait'
      - '{{.DOCKER_COMPOSE}} exec phpfpm composer install'
      - '{{.DOCKER_COMPOSE}} run --rm node sh -c "npm install && npm run build"'

  race:stop:
    desc: "Stop race-frontend site"
    dir: race-frontend
    cmds:
      - '{{.DOCKER_COMPOSE}} down'

  race:composer:
    desc: "Run composer in race-frontend site"
    dir: race-frontend
    cmds:
      - '{{.DOCKER_COMPOSE}} exec phpfpm composer {{.CLI_ARGS}}'
    silent: true

  # ============ ARCHIVE ============
  archive:compose:
    dir: archive
    cmds:
      - '{{.DOCKER_COMPOSE}} {{.CLI_ARGS}}'

  archive:start:
    desc: "Start archive site"
    dir: archive
    cmds:
      - '{{.DOCKER_COMPOSE}} pull'
      - '{{.DOCKER_COMPOSE}} up --detach --remove-orphans --wait'
      - '{{.DOCKER_COMPOSE}} exec phpfpm composer install'

  archive:stop:
    desc: "Stop archive site"
    dir: archive
    cmds:
      - '{{.DOCKER_COMPOSE}} down'

  archive:composer:
    desc: "Run composer in archive site"
    dir: archive
    cmds:
      - '{{.DOCKER_COMPOSE}} exec phpfpm composer {{.CLI_ARGS}}'
    silent: true

  # ============ ASSETS ============
  assets:build:
    desc: "Build assets for admin and race-frontend"
    cmds:
      - task: assets:build:admin
      - task: assets:build:race

  assets:build:admin:
    desc: "Build admin assets"
    dir: admin
    cmds:
      - '{{.DOCKER_COMPOSE}} run --rm node sh -c "npm install && npm run build"'

  assets:build:race:
    desc: "Build race-frontend assets"
    dir: race-frontend
    cmds:
      - '{{.DOCKER_COMPOSE}} run --rm node sh -c "npm install && npm run build"'

  assets:watch:admin:
    desc: "Watch admin assets"
    dir: admin
    cmds:
      - '{{.DOCKER_COMPOSE}} run --rm node sh -c "npm install && npm run watch"'

  assets:watch:race:
    desc: "Watch race-frontend assets"
    dir: race-frontend
    cmds:
      - '{{.DOCKER_COMPOSE}} run --rm node sh -c "npm install && npm run watch"'

  design:build:
    desc: "Build design assets"
    dir: design
    cmds:
      - '{{.DOCKER_COMPOSE}} run --rm node sh -c "npm install && npm run build"'

  design:watch:
    desc: "Watch design assets"
    dir: design
    cmds:
      - '{{.DOCKER_COMPOSE}} run --rm node sh -c "npm install && npm run watch"'

  design:serve:
    desc: "Serve design site locally on http://localhost:8088"
    dir: design
    cmds:
      - '{{.DOCKER_COMPOSE}} run --rm --service-ports node sh -c "npm install && npm run build && npx --yes http-server -p 8088 -c-1 ."'

  # ============ PREVIEW STACK ============
  # Run a worktree end-to-end alongside the main stack for manual PR review.
  # See preview/README.md for the full workflow.
  #
  # Internal helpers:
  #   _preview:guard         errors out if any scavenger_preview container is running
  #
  # Public targets:
  #   preview-issue:up         bring up the full preview stack (admin/race/archive/design) for issue #N
  #   preview-issue:design:up  bring up ONLY the design playground for issue #N (no PHP / DB)
  #   preview-issue:down       tear down whatever preview is currently running
  #   preview-issue:fixtures   force-reload Doctrine fixtures into the preview DB
  #   preview-issue:logs       follow logs from the preview stack
  #   preview-issue:status     show the resolved worktree and running containers
  #
  # Notes:
  #   - The compose file lives at preview/docker-compose.yml and is invoked
  #     by setting COMPOSE_PROJECT_NAME=scavenger_preview plus several
  #     PREVIEW_* env vars (see preview/docker-compose.yml for the contract).
  #   - We share the main stack's `scavenger_app` network so the preview
  #     reuses mercure, rabbit, and mail — do NOT spin up duplicates.

  _preview:guard:
    internal: true
    silent: true
    desc: "Error if a preview stack is already running (any issue)"
    cmds:
      - |
        running=$(docker ps --filter "label=com.docker.compose.project=scavenger_preview" --format '{{`{{.Names}}`}}')
        if [ -n "$running" ]; then
          echo "error: a preview stack is already running:" >&2
          echo "$running" | sed 's/^/       - /' >&2
          echo "" >&2
          echo "Run 'task preview-issue:down' first." >&2
          exit 1
        fi

  preview-issue:up:
    desc: "Bring up the preview stack for issue #N (usage: task preview-issue:up -- 17)"
    silent: true
    vars:
      ISSUE: '{{.CLI_ARGS}}'
    cmds:
      - task: _preview:guard
      - |
        if [ -z "{{.ISSUE}}" ]; then
          echo "usage: task preview-issue:up -- <issue-number>" >&2
          exit 1
        fi
      - |
        # Force the compose project name for this stack; do NOT inherit
        # admin/.env's COMPOSE_PROJECT_NAME=scavenger (that would clobber
        # the main stack's containers). All docker compose invocations
        # below pass --project-name explicitly via the -p flag.
        export COMPOSE_PROJECT_NAME=scavenger_preview

        # Pull COMPOSE_DOMAIN from admin/.env without sourcing the whole file
        # (which would otherwise re-set COMPOSE_PROJECT_NAME).
        if [ -z "${COMPOSE_DOMAIN:-}" ]; then
          if [ -f admin/.env ]; then
            COMPOSE_DOMAIN=$(grep -E '^COMPOSE_DOMAIN=' admin/.env | head -1 | cut -d= -f2-)
          fi
        fi
        export COMPOSE_DOMAIN="${COMPOSE_DOMAIN:-scavenger.local.itkdev.dk}"

        worktree=$(./bin/preview-resolve.sh {{.ISSUE}})
        echo "Preview worktree: $worktree"

        # Decide vendor / node_modules strategy per site based on composer.lock /
        # package-lock.json diff vs. main. If locks match, bind-mount the main
        # checkout's vendor (read-only-ish — we mount it RW so composer can
        # still update if asked, but normal workflow won't write to it). If the
        # locks differ or no main vendor exists, fall back to a named volume
        # and run `composer install` inside the container.
        main_repo="$(git rev-parse --show-toplevel)"
        # If we're inside a worktree, find the actual main checkout instead.
        main_repo=$(git worktree list --porcelain | awk '/^worktree / {p=$2} /^branch refs\/heads\/main$/ {print p; exit}')

        decide_mount() {
          local site="$1" lockfile="$2" subdir="$3"
          local worktree_lock="$worktree/$site/$lockfile"
          local main_lock="$main_repo/$site/$lockfile"
          local main_dir="$main_repo/$site/$subdir"
          if [ -f "$worktree_lock" ] && [ -f "$main_lock" ] && cmp -s "$worktree_lock" "$main_lock" && [ -d "$main_dir" ]; then
            echo "$main_dir"
          else
            # Use a docker named volume; compose will create it lazily.
            # Prefix with scavenger_preview_ so teardown sweeps them.
            echo "scavenger_preview_${site}_${subdir}"
          fi
        }

        export PREVIEW_WORKTREE="$worktree"
        export PREVIEW_ISSUE="{{.ISSUE}}"
        export PREVIEW_DOMAIN="${COMPOSE_DOMAIN:-scavenger.local.itkdev.dk}"
        export PREVIEW_MAIN_PROJECT="${PREVIEW_MAIN_PROJECT:-scavenger}"
        export PREVIEW_SHARED="$worktree/shared"
        export PREVIEW_ADMIN_VENDOR="$(decide_mount admin composer.lock vendor)"
        export PREVIEW_RACE_VENDOR="$(decide_mount race-frontend composer.lock vendor)"
        export PREVIEW_ARCHIVE_VENDOR="$(decide_mount archive composer.lock vendor)"
        export PREVIEW_ADMIN_NODE_MODULES="$(decide_mount admin package-lock.json node_modules)"
        export PREVIEW_RACE_NODE_MODULES="$(decide_mount race-frontend package-lock.json node_modules)"
        export PREVIEW_ARCHIVE_NODE_MODULES="$(decide_mount archive package-lock.json node_modules)"
        export PREVIEW_DESIGN_NODE_MODULES="$(decide_mount design package-lock.json node_modules)"

        echo "Mounts:"
        echo "  admin   vendor       -> $PREVIEW_ADMIN_VENDOR"
        echo "  race    vendor       -> $PREVIEW_RACE_VENDOR"
        echo "  archive vendor       -> $PREVIEW_ARCHIVE_VENDOR"
        echo "  admin   node_modules -> $PREVIEW_ADMIN_NODE_MODULES"
        echo "  race    node_modules -> $PREVIEW_RACE_NODE_MODULES"
        echo "  archive node_modules -> $PREVIEW_ARCHIVE_NODE_MODULES"
        echo "  design  node_modules -> $PREVIEW_DESIGN_NODE_MODULES"

        echo "Bringing up preview stack…"
        {{.DOCKER_COMPOSE}} -f preview/docker-compose.yml -p scavenger_preview up --detach --wait

        # Install deps inside any container where we used a named volume
        # (i.e. the lockfiles differ between main and the worktree).
        install_if_volume() {
          local mountvar="$1" service="$2" install_cmd="$3"
          local val
          eval "val=\${$mountvar}"
          case "$val" in
            /*) echo "  [skip] $service: bind-mounted from main" ;;
            *)  echo "  [run]  $service: $install_cmd" ; {{.DOCKER_COMPOSE}} -f preview/docker-compose.yml -p scavenger_preview exec -T "$service" sh -c "$install_cmd" ;;
          esac
        }

        echo "Resolving vendor per service…"
        install_if_volume PREVIEW_ADMIN_VENDOR   admin-phpfpm   "composer install --no-interaction --no-progress"
        install_if_volume PREVIEW_RACE_VENDOR    race-phpfpm    "composer install --no-interaction --no-progress"
        install_if_volume PREVIEW_ARCHIVE_VENDOR archive-phpfpm "composer install --no-interaction --no-progress"

        # Assets: public/build/ is gitignored, so worktrees never have it.
        # Always rebuild into each worktree, regardless of whether
        # node_modules is bind-mounted from main or a fresh named volume.
        # When the lockfile matches main we still get the speedup of not
        # having to reinstall node_modules.
        build_assets() {
          local site="$1" mountvar="$2"
          local val
          eval "val=\${$mountvar}"
          local install_step
          case "$val" in
            /*) install_step="echo '  [skip] $site: node_modules bind-mounted from main'" ;;
            *)  install_step="echo '  [run]  $site: npm ci' && npm ci" ;;
          esac
          echo "  [run]  $site: npm run build"
          {{.DOCKER_COMPOSE}} -f preview/docker-compose.yml -p scavenger_preview run --rm --workdir "/app/$site" node sh -c "$install_step && npm run build"
        }

        echo "Building assets per site…"
        build_assets admin         PREVIEW_ADMIN_NODE_MODULES
        build_assets race-frontend PREVIEW_RACE_NODE_MODULES
        build_assets archive       PREVIEW_ARCHIVE_NODE_MODULES
        build_assets design        PREVIEW_DESIGN_NODE_MODULES

        # Always run migrations against the preview DB.
        echo "Running migrations on preview DB…"
        {{.DOCKER_COMPOSE}} -f preview/docker-compose.yml -p scavenger_preview exec -T admin-phpfpm bin/console doctrine:migrations:migrate --no-interaction

        # Idempotent fixtures probe — only load if user table is empty.
        echo "Checking whether to load fixtures…"
        user_count_raw=$({{.DOCKER_COMPOSE}} -f preview/docker-compose.yml -p scavenger_preview exec -T admin-phpfpm bin/console dbal:run-sql "SELECT COUNT(*) AS c FROM user" 2>/dev/null || true)
        # Extract the digit from the table output (e.g. "  20  " between separators).
        user_count=$(echo "$user_count_raw" | grep -E '^[[:space:]]+[0-9]+[[:space:]]*$' | head -1 | tr -d '[:space:]')
        if [ -z "$user_count" ] || [ "$user_count" = "0" ]; then
          echo "  user table empty — loading fixtures"
          {{.DOCKER_COMPOSE}} -f preview/docker-compose.yml -p scavenger_preview exec -T admin-phpfpm bin/console doctrine:fixtures:load --no-interaction
        else
          echo "  user table has $user_count rows — skipping fixtures (use 'task preview-issue:fixtures' to force)"
        fi

        echo ""
        echo "Preview is up. Issue #{{.ISSUE}} reachable at:"
        echo "  https://admin-preview-{{.ISSUE}}.${PREVIEW_DOMAIN}"
        echo "  https://race-preview-{{.ISSUE}}.${PREVIEW_DOMAIN}"
        echo "  https://archive-preview-{{.ISSUE}}.${PREVIEW_DOMAIN}"
        echo "  https://design-preview-{{.ISSUE}}.${PREVIEW_DOMAIN}"

  preview-issue:design:up:
    desc: "Bring up ONLY the design preview for issue #N (usage: task preview-issue:design:up -- 17)"
    silent: true
    vars:
      ISSUE: '{{.CLI_ARGS}}'
    cmds:
      - task: _preview:guard
      - |
        if [ -z "{{.ISSUE}}" ]; then
          echo "usage: task preview-issue:design:up -- <issue-number>" >&2
          exit 1
        fi
      - |
        # Design-only preview: static HTML + Tailwind, no PHP, no DB.
        # Skips composer install, doctrine migrations, fixtures — all the
        # heavy Symfony plumbing the full :up does. Use this for fast
        # iteration on design/ changes without spinning up the full stack.
        export COMPOSE_PROJECT_NAME=scavenger_preview

        if [ -z "${COMPOSE_DOMAIN:-}" ]; then
          if [ -f admin/.env ]; then
            COMPOSE_DOMAIN=$(grep -E '^COMPOSE_DOMAIN=' admin/.env | head -1 | cut -d= -f2-)
          fi
        fi
        export COMPOSE_DOMAIN="${COMPOSE_DOMAIN:-scavenger.local.itkdev.dk}"

        worktree=$(./bin/preview-resolve.sh {{.ISSUE}})
        echo "Preview worktree: $worktree"

        # Resolve the main repo path so decide_mount can compare lockfiles.
        main_repo=$(git worktree list --porcelain | awk '/^worktree / {p=$2} /^branch refs\/heads\/main$/ {print p; exit}')

        decide_mount() {
          local site="$1" lockfile="$2" subdir="$3"
          local worktree_lock="$worktree/$site/$lockfile"
          local main_lock="$main_repo/$site/$lockfile"
          local main_dir="$main_repo/$site/$subdir"
          if [ -f "$worktree_lock" ] && [ -f "$main_lock" ] && cmp -s "$worktree_lock" "$main_lock" && [ -d "$main_dir" ]; then
            echo "$main_dir"
          else
            echo "scavenger_preview_${site}_${subdir}"
          fi
        }

        # Stub PREVIEW_* vars for the Symfony services we are NOT bringing up;
        # compose still parses the entire file and interpolates the volume
        # sources even when --service-list filters bring-up.
        export PREVIEW_WORKTREE="$worktree"
        export PREVIEW_ISSUE="{{.ISSUE}}"
        export PREVIEW_DOMAIN="${COMPOSE_DOMAIN:-scavenger.local.itkdev.dk}"
        export PREVIEW_MAIN_PROJECT="${PREVIEW_MAIN_PROJECT:-scavenger}"
        export PREVIEW_SHARED="$worktree/shared"
        export PREVIEW_ADMIN_VENDOR=/tmp
        export PREVIEW_RACE_VENDOR=/tmp
        export PREVIEW_ARCHIVE_VENDOR=/tmp
        export PREVIEW_ADMIN_NODE_MODULES=/tmp
        export PREVIEW_RACE_NODE_MODULES=/tmp
        export PREVIEW_ARCHIVE_NODE_MODULES=/tmp
        export PREVIEW_DESIGN_NODE_MODULES="$(decide_mount design package-lock.json node_modules)"

        echo "Mounts:"
        echo "  design  node_modules -> $PREVIEW_DESIGN_NODE_MODULES"

        # Build design assets first so the static site has fresh dist/css/.
        build_assets() {
          local site="$1" mountvar="$2"
          local val
          eval "val=\${$mountvar}"
          local install_step
          case "$val" in
            /*) install_step="echo '  [skip] $site: node_modules bind-mounted from main'" ;;
            *)  install_step="echo '  [run]  $site: npm ci' && npm ci" ;;
          esac
          echo "  [run]  $site: npm run build"
          {{.DOCKER_COMPOSE}} -f preview/docker-compose.yml -p scavenger_preview run --rm --workdir "/app/$site" node sh -c "$install_step && npm run build"
        }

        echo "Building design assets…"
        build_assets design PREVIEW_DESIGN_NODE_MODULES

        echo "Bringing up design-nginx…"
        {{.DOCKER_COMPOSE}} -f preview/docker-compose.yml -p scavenger_preview up --detach --wait design-nginx

        echo ""
        echo "Design preview is up. Issue #{{.ISSUE}} reachable at:"
        echo "  https://design-preview-{{.ISSUE}}.${PREVIEW_DOMAIN}"

  preview-issue:down:
    desc: "Tear down the preview stack (containers, network, volumes)"
    silent: true
    cmds:
      - |
        echo "Tearing down preview stack…"
        # Compose interpolates the volume sources even on `down`. We never
        # mount these for teardown, but the parser still needs values.
        export PREVIEW_WORKTREE=/tmp
        export PREVIEW_ISSUE=0
        export PREVIEW_DOMAIN=scavenger.local.itkdev.dk
        export PREVIEW_MAIN_PROJECT=scavenger
        export PREVIEW_SHARED=/tmp
        export PREVIEW_ADMIN_VENDOR=/tmp
        export PREVIEW_RACE_VENDOR=/tmp
        export PREVIEW_ARCHIVE_VENDOR=/tmp
        export PREVIEW_ADMIN_NODE_MODULES=/tmp
        export PREVIEW_RACE_NODE_MODULES=/tmp
        export PREVIEW_ARCHIVE_NODE_MODULES=/tmp
        export PREVIEW_DESIGN_NODE_MODULES=/tmp
        {{.DOCKER_COMPOSE}} -f preview/docker-compose.yml -p scavenger_preview down --volumes --remove-orphans
        echo "Preview stack down."

  preview-issue:fixtures:
    desc: "Force-reload Doctrine fixtures into the preview DB (DESTRUCTIVE)"
    silent: true
    cmds:
      - |
        running=$(docker ps --filter "label=com.docker.compose.project=scavenger_preview" --filter "label=com.docker.compose.service=admin-phpfpm" --format '{{`{{.Names}}`}}')
        if [ -z "$running" ]; then
          echo "error: preview stack is not running — start it with 'task preview-issue:up -- <N>'" >&2
          exit 1
        fi
        # exec doesn't actually need any bind sources, but compose still
        # parses the file — stub the PREVIEW_* vars so interpolation works.
        export PREVIEW_WORKTREE=/tmp PREVIEW_ISSUE=0 PREVIEW_DOMAIN=scavenger.local.itkdev.dk PREVIEW_MAIN_PROJECT=scavenger
        export PREVIEW_SHARED=/tmp PREVIEW_ADMIN_VENDOR=/tmp PREVIEW_RACE_VENDOR=/tmp PREVIEW_ARCHIVE_VENDOR=/tmp
        export PREVIEW_ADMIN_NODE_MODULES=/tmp PREVIEW_RACE_NODE_MODULES=/tmp PREVIEW_ARCHIVE_NODE_MODULES=/tmp PREVIEW_DESIGN_NODE_MODULES=/tmp
        echo "Reloading fixtures into preview DB…"
        {{.DOCKER_COMPOSE}} -f preview/docker-compose.yml -p scavenger_preview exec -T admin-phpfpm bin/console doctrine:fixtures:load --no-interaction
        echo "Fixtures reloaded."

  preview-issue:logs:
    desc: "Follow logs from the preview stack (Ctrl+C to stop)"
    silent: true
    cmds:
      - |
        export PREVIEW_WORKTREE=/tmp PREVIEW_ISSUE=0 PREVIEW_DOMAIN=scavenger.local.itkdev.dk PREVIEW_MAIN_PROJECT=scavenger
        export PREVIEW_SHARED=/tmp PREVIEW_ADMIN_VENDOR=/tmp PREVIEW_RACE_VENDOR=/tmp PREVIEW_ARCHIVE_VENDOR=/tmp
        export PREVIEW_ADMIN_NODE_MODULES=/tmp PREVIEW_RACE_NODE_MODULES=/tmp PREVIEW_ARCHIVE_NODE_MODULES=/tmp PREVIEW_DESIGN_NODE_MODULES=/tmp
        {{.DOCKER_COMPOSE}} -f preview/docker-compose.yml -p scavenger_preview logs --follow --tail=100

  preview-issue:status:
    desc: "Show the running preview stack (containers, volumes, network)"
    silent: true
    cmds:
      - |
        running=$(docker ps --filter "label=com.docker.compose.project=scavenger_preview" --format 'table {{`{{.Names}}\t{{.Status}}\t{{.Image}}`}}')
        if [ -z "$running" ] || [ "$(echo "$running" | wc -l)" -le 1 ]; then
          echo "No preview stack running."
          exit 0
        fi
        echo "Preview stack containers:"
        echo "$running"

  default:
    cmds:
      - task --list-all
    silent: true
