version: '3'

vars:
  DOCKER_COMPOSE: '{{.TASK_DOCKER_COMPOSE | default "docker compose"}}'

tasks:
  start:
    desc: "Start all three sites"
    cmds:
      - task: admin:start
      - task: race:start
      - task: archive:start

  stop:
    desc: "Stop all three sites"
    cmds:
      - task: archive:stop
      - task: race:stop
      - task: admin:stop

  sites:open:
    desc: "Open all three sites in the default browser"
    cmds:
      - task: sites:open:admin
      - task: sites:open:race
      - task: sites:open:archive

  sites:open:admin:
    desc: "Open admin site in the default browser"
    dir: admin
    dotenv: ['.env']
    cmds:
      - open "https://admin-${COMPOSE_DOMAIN}"
    silent: true

  sites:open:race:
    desc: "Open race-frontend site in the default browser"
    dir: race-frontend
    dotenv: ['.env']
    cmds:
      - open "https://race-${COMPOSE_DOMAIN}"
    silent: true

  sites:open:archive:
    desc: "Open archive site in the default browser"
    dir: archive
    dotenv: ['.env']
    cmds:
      - open "https://archive-${COMPOSE_DOMAIN}"
    silent: true

  # ============ ADMIN ============
  admin:compose:
    dir: admin
    cmds:
      - '{{.DOCKER_COMPOSE}} {{.CLI_ARGS}}'

  admin:start:
    desc: "Start admin site (includes shared infrastructure)"
    dir: admin
    cmds:
      - '{{.DOCKER_COMPOSE}} pull'
      - '{{.DOCKER_COMPOSE}} up --detach --remove-orphans --wait'
      - '{{.DOCKER_COMPOSE}} exec phpfpm composer install'
      - '{{.DOCKER_COMPOSE}} run --rm node sh -c "npm install && npm run build"'
      - '{{.DOCKER_COMPOSE}} exec phpfpm bin/console doctrine:migrations:migrate --no-interaction'

  admin:stop:
    desc: "Stop admin site"
    dir: admin
    cmds:
      - '{{.DOCKER_COMPOSE}} down'

  admin:composer:
    desc: "Run composer in admin site"
    dir: admin
    cmds:
      - '{{.DOCKER_COMPOSE}} exec phpfpm composer {{.CLI_ARGS}}'
    silent: true

  admin:console:
    desc: "Run Symfony console in admin site"
    dir: admin
    cmds:
      - '{{.DOCKER_COMPOSE}} exec phpfpm bin/console {{.CLI_ARGS}}'
    silent: true

  admin:migrate:
    desc: "Run database migrations"
    dir: admin
    cmds:
      - '{{.DOCKER_COMPOSE}} exec phpfpm bin/console doctrine:migrations:migrate --no-interaction'
    silent: true

  # ============ RACE FRONTEND ============
  race:compose:
    dir: race-frontend
    cmds:
      - '{{.DOCKER_COMPOSE}} {{.CLI_ARGS}}'

  race:start:
    desc: "Start race-frontend site"
    dir: race-frontend
    cmds:
      - '{{.DOCKER_COMPOSE}} pull'
      - '{{.DOCKER_COMPOSE}} up --detach --remove-orphans --wait'
      - '{{.DOCKER_COMPOSE}} exec phpfpm composer install'
      - '{{.DOCKER_COMPOSE}} run --rm node sh -c "npm install && npm run build"'

  race:stop:
    desc: "Stop race-frontend site"
    dir: race-frontend
    cmds:
      - '{{.DOCKER_COMPOSE}} down'

  race:composer:
    desc: "Run composer in race-frontend site"
    dir: race-frontend
    cmds:
      - '{{.DOCKER_COMPOSE}} exec phpfpm composer {{.CLI_ARGS}}'
    silent: true

  # ============ ARCHIVE ============
  archive:compose:
    dir: archive
    cmds:
      - '{{.DOCKER_COMPOSE}} {{.CLI_ARGS}}'

  archive:start:
    desc: "Start archive site"
    dir: archive
    cmds:
      - '{{.DOCKER_COMPOSE}} pull'
      - '{{.DOCKER_COMPOSE}} up --detach --remove-orphans --wait'
      - '{{.DOCKER_COMPOSE}} exec phpfpm composer install'

  archive:stop:
    desc: "Stop archive site"
    dir: archive
    cmds:
      - '{{.DOCKER_COMPOSE}} down'

  archive:composer:
    desc: "Run composer in archive site"
    dir: archive
    cmds:
      - '{{.DOCKER_COMPOSE}} exec phpfpm composer {{.CLI_ARGS}}'
    silent: true

  # ============ ASSETS ============
  assets:build:
    desc: "Build assets for admin and race-frontend"
    cmds:
      - task: assets:build:admin
      - task: assets:build:race

  assets:build:admin:
    desc: "Build admin assets"
    dir: admin
    cmds:
      - '{{.DOCKER_COMPOSE}} run --rm node sh -c "npm install && npm run build"'

  assets:build:race:
    desc: "Build race-frontend assets"
    dir: race-frontend
    cmds:
      - '{{.DOCKER_COMPOSE}} run --rm node sh -c "npm install && npm run build"'

  assets:watch:admin:
    desc: "Watch admin assets"
    dir: admin
    cmds:
      - '{{.DOCKER_COMPOSE}} run --rm node sh -c "npm install && npm run watch"'

  assets:watch:race:
    desc: "Watch race-frontend assets"
    dir: race-frontend
    cmds:
      - '{{.DOCKER_COMPOSE}} run --rm node sh -c "npm install && npm run watch"'

  default:
    cmds:
      - task --list-all
    silent: true
