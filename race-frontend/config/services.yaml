parameters:
    admin_api_url: '%env(ADMIN_API_URL)%'
    admin_api_key: '%env(ADMIN_API_KEY)%'
    mercure_public_url: '%env(MERCURE_PUBLIC_URL)%'
    mercure_jwt_secret: '%env(MERCURE_JWT_SECRET)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: "../src/"

    Scavenger\Shared\ApiClient\AdminApiClient:
        arguments:
            $adminApiUrl: '%admin_api_url%'
            $apiKey: '%admin_api_key%'

    App\Twig\MercureExtension:
        arguments:
            $mercureJwtSecret: '%mercure_jwt_secret%'
            $mercurePublicUrl: '%mercure_public_url%'
