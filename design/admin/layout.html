<!--
  Admin shell partial — reference layout combining sidebar nav, topbar, and
  main content slot. Other admin pages copy this shell and replace the
  <main> contents.

  When porting to Twig, this becomes the base layout extended by each page.
-->
<!doctype html>
<html lang="en" data-theme="default">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Shell — Scavenger Hunt</title>
  <link rel="stylesheet" href="../dist/css/app.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" />
</head>
<body class="bg-neutral-100">

  <div class="min-h-screen grid grid-cols-[240px_1fr]">

    <!-- Sidebar ------------------------------------------------ -->
    <aside class="bg-neutral-900 text-neutral-100 flex flex-col">
      <div class="h-14 px-4 flex items-center gap-2 border-b border-neutral-800">
        <span class="inline-block w-7 h-7 rounded-md bg-brand-500"></span>
        <span class="font-display text-lg">Admin</span>
      </div>
      <nav class="flex-1 px-2 py-3 space-y-0.5 text-sm">
        <a href="#" class="flex items-center gap-2 px-3 py-2 rounded-md bg-neutral-800 text-white no-underline">Dashboard</a>
        <a href="#" class="flex items-center gap-2 px-3 py-2 rounded-md text-neutral-300 hover:bg-neutral-800 hover:text-white no-underline">Hunts</a>
        <a href="#" class="flex items-center gap-2 px-3 py-2 rounded-md text-neutral-300 hover:bg-neutral-800 hover:text-white no-underline">Races</a>
        <a href="#" class="flex items-center gap-2 px-3 py-2 rounded-md text-neutral-300 hover:bg-neutral-800 hover:text-white no-underline">Tasks</a>
        <a href="#" class="flex items-center gap-2 px-3 py-2 rounded-md text-neutral-300 hover:bg-neutral-800 hover:text-white no-underline">Users</a>
        <div class="mt-4 mb-2 px-3 text-[10px] uppercase tracking-wider text-neutral-500">System</div>
        <a href="#" class="flex items-center gap-2 px-3 py-2 rounded-md text-neutral-300 hover:bg-neutral-800 hover:text-white no-underline">Settings</a>
        <a href="#" class="flex items-center gap-2 px-3 py-2 rounded-md text-neutral-300 hover:bg-neutral-800 hover:text-white no-underline">Audit log</a>
      </nav>
      <div class="px-3 py-3 border-t border-neutral-800 text-xs text-neutral-500">
        v0.1.0 · staging
      </div>
    </aside>

    <!-- Main pane --------------------------------------------- -->
    <div class="flex flex-col min-w-0">

      <!-- Topbar -->
      <header class="h-14 bg-white border-b border-neutral-200 flex items-center justify-between px-6">
        <div class="flex items-center gap-3 text-sm text-neutral-500">
          <a href="#" class="hover:text-neutral-800 no-underline">Dashboard</a>
          <span>/</span>
          <span class="text-neutral-800 font-medium">Hunts</span>
        </div>
        <div class="flex items-center gap-3">
          <input class="input w-72" placeholder="Search hunts, races, users…" />
          <button class="btn-ghost btn-sm" aria-label="Notifications">🔔</button>
          <div class="w-8 h-8 rounded-full bg-brand-600 text-white flex items-center justify-center text-sm font-medium">MY</div>
        </div>
      </header>

      <!-- Slot -->
      <main class="flex-1 p-6">
        <p class="text-sm text-neutral-500">
          This is the admin shell partial. The list, edit, and dashboard pages
          plug into this same grid.
        </p>
      </main>
    </div>
  </div>
</body>
</html>
