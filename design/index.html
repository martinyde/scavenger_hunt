<!doctype html>
<html lang="en" data-theme="default">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scavenger Hunt — Design Site</title>
  <link rel="stylesheet" href="dist/css/app.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=JetBrains+Mono:wght@400;600&display=swap" />
</head>
<body class="bg-neutral-50">

  <!-- Design-site shell ------------------------------------------------- -->
  <header class="bg-white border-b border-neutral-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-6 flex items-center justify-between h-14">
      <a href="#/" class="flex items-center gap-2 no-underline">
        <span class="inline-block w-7 h-7 rounded-md bg-brand-600"></span>
        <span class="font-display text-lg text-neutral-900">Scavenger Hunt</span>
        <span class="pill-neutral ml-2">Design</span>
      </a>
      <nav class="flex items-center gap-1">
        <a class="shell-tab" data-shell-tab="/design-system" href="#/design-system">Design system</a>
        <a class="shell-tab" data-shell-tab="/archive"       href="#/archive">Archive</a>
        <a class="shell-tab" data-shell-tab="/admin"         href="#/admin">Admin</a>
        <a class="shell-tab" data-shell-tab="/race"          href="#/race">Race display</a>
      </nav>
      <div class="flex items-center gap-3">
        <div data-theme-picker class="flex items-center"></div>
      </div>
    </div>
  </header>

  <main data-router-outlet class="max-w-7xl mx-auto"></main>

  <footer class="border-t border-neutral-200 mt-16">
    <div class="max-w-7xl mx-auto px-6 py-6 text-xs text-neutral-500 flex justify-between">
      <span>Static design playground — not connected to a backend.</span>
      <span>Built with Tailwind + vanilla JS.</span>
    </div>
  </footer>

  <script type="module" src="src/js/themes.js"></script>
  <script src="src/js/router.js"></script>
</body>
</html>
